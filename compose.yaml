services:
  backend:
    build: ./backend
    env_file: .env
    environment:
      ENVIRONMENT: production
      DATABASE_URL: sqlite+aiosqlite:////app/data/studyflow.db
      OLLAMA_BASE_URL: http://host.docker.internal:11434
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - studyflow-data:/app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
  frontend:
    build:
      context: ./frontend
      args:
        BACKEND_URL: http://backend:8000
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  studyflow-data:
